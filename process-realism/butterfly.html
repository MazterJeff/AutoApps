<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Process Trace</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #14181d; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: crosshair; touch-action: none; }
  #bug { position: fixed; left: 0; top: 0; pointer-events: none; }
  #hint {
    position: fixed; left: 0; right: 0; bottom: 22px; text-align: center; pointer-events: none;
    font: 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .3em;
    color: #ddd5c3; opacity: .5; transition: opacity 2s;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="bug"></canvas>
<div id="hint">CLICK · DRAG</div>
<script>
'use strict';
// ---------------------------------------------------------------------------
// Process trace — the texture of a swallowtail wing, without the wing.
//
// VEINS   Attractor points are scattered over the whole surface. Each pulls
//         only its nearest vein node within reach; a node grows one step
//         toward the average pull, keeps heading away from where its vein
//         started, and forks when the pulls on it diverge. Attractors close
//         to a vein are consumed, which keeps the veins evenly spaced.
// PIGMENT A morphogen u is held at 1 on the veins, diffuses and decays:
//         du/dt = ∇²u − u/λ². Each cell reads u through a band-pass rule:
//         high u → dark, middle u → pale, low u → dark again. So every vein
//         is a dark line inside a pale ray, and where two veins drift apart
//         the ray splits along a dark fold before the veins fork.
// The thresholds drift with a slow wave, so the rays keep opening and closing,
// and the two tones fade slowly from hue to hue across the surface.
//
// Mouse: a caterpillar crawls after the pointer. Drag, and its head lays a
// vein; click, and the surface is wounded and reseeded.
// ---------------------------------------------------------------------------

const CELL = 2;                  // css px per simulation cell
const STEP = 1.3;                // vein growth step (cells)
const KILL = 6;                  // attractors this close to a vein are consumed
const REACH = 18;                // attractors pull veins only within this distance
const DENSITY = 1 / 16;          // attractors per cell
const RADIAL = 1.5;              // tips keep heading away from their origin
const WOBBLE = 0.025;
const LAMBDA = 5;                // pigment decay length (cells)
const DT = 0.24, ITER = 12;
const HI = 0.7, LO = 0.2, E = 0.03;
const CLICK_R = 90, DRAG_R = 34; // wound radii (cells)

const rand = Math.random;
const gauss = () => { let a = 0; while (!a) a = rand(); return Math.sqrt(-2 * Math.log(a)) * Math.cos(2 * Math.PI * rand()); };
const smooth = (a, b, x) => { x = (x - a) / (b - a); x = x < 0 ? 0 : x > 1 ? 1 : x; return x * x * (3 - 2 * x); };

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const vc = document.createElement('canvas'), vg = vc.getContext('2d', { willReadFrequently: true });
const hint = document.getElementById('hint');

// ---------- colour -----------------------------------------------------------
// Matched pale/dark pairs. The hue drifts across the screen and through time.
const PAPERS = [[222, 214, 196], [228, 198, 190], [226, 211, 172], [198, 215, 193], [191, 207, 223], [213, 201, 228]];
const INKS = [[20, 24, 29], [40, 18, 26], [34, 25, 12], [14, 32, 24], [12, 22, 40], [30, 18, 40]];
const LUT = 1024;
function makeLut(keys) {
  const out = new Float32Array(LUT * 3);
  for (let i = 0; i < LUT; i++) {
    const f = i / LUT * keys.length, k = f | 0, t = (1 - Math.cos((f - k) * Math.PI)) / 2;
    const a = keys[k], b = keys[(k + 1) % keys.length];
    for (let c = 0; c < 3; c++) out[i * 3 + c] = a[c] + (b[c] - a[c]) * t;
  }
  return out;
}
const PAPER_LUT = makeLut(PAPERS), INK_LUT = makeLut(INKS);
const HUE_X = 240, HUE_Y = 160, HUE_T = 9;       // spread across the screen; drift per second
const hueAt = (x, y, t) => ((x / GW * HUE_X + y / GH * HUE_Y + t * HUE_T) | 0) & (LUT - 1);

let GW, GH, N, u, u2, srcList, noise, img, BW, BH, buckets, nodes, atts, dirty, steps;

function init() {
  GW = Math.ceil(innerWidth / CELL); GH = Math.ceil(innerHeight / CELL); N = GW * GH;
  cv.width = vc.width = GW; cv.height = vc.height = GH;
  u = new Float32Array(N); u2 = new Float32Array(N); srcList = new Int32Array(0);
  img = ctx.createImageData(GW, GH);
  noise = makeNoise();
  BW = Math.ceil(GW / REACH); BH = Math.ceil(GH / REACH);
  buckets = Array.from({ length: BW * BH }, () => []);
  nodes = []; atts = []; steps = 0; deadCount = 0;
  vg.clearRect(0, 0, GW, GH);
  scatter(GW / 2, GH / 2, Infinity);
  addNode(GW / 2, GH / 2, -1, 0);
  dirty = true;
}

// Smooth low-amplitude noise, so band edges are organic rather than ruled.
function makeNoise() {
  const out = new Float32Array(N);
  for (const [scale, amp] of [[9, 0.02], [3, 0.008]]) {
    const cw = Math.ceil(GW / scale) + 2, lat = Float32Array.from({ length: cw * (Math.ceil(GH / scale) + 2) }, rand);
    for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) {
      const fx = x / scale, fy = y / scale, xi = fx | 0, yi = fy | 0;
      let tx = fx - xi, ty = fy - yi; tx = tx * tx * (3 - 2 * tx); ty = ty * ty * (3 - 2 * ty);
      const a = lat[yi * cw + xi], b = lat[yi * cw + xi + 1], c = lat[(yi + 1) * cw + xi], d = lat[(yi + 1) * cw + xi + 1];
      out[y * GW + x] += amp * 2 * (a + (b - a) * tx + (c - a) * ty + (a - b - c + d) * tx * ty - 0.5);
    }
  }
  return out;
}

// ---------- veins ------------------------------------------------------------
const bucketOf = (x, y) => Math.min(BH - 1, Math.max(0, (y / REACH) | 0)) * BW + Math.min(BW - 1, Math.max(0, (x / REACH) | 0));

// origin: the point this vein keeps heading away from (defaults to the node itself).
function addNode(x, y, parent, width, origin, stroke = 0) {
  const k = nodes.length;
  const n = { x, y, p: parent, w: width || 2.4, dead: false, stroke, kids: 0 };
  n.ox = origin === undefined ? x : origin[0];
  n.oy = origin === undefined ? y : origin[1];
  nodes.push(n);
  buckets[bucketOf(x, y)].push(k);
  if (parent >= 0) drawSegment(nodes[parent], n);
  return k;
}

function drawSegment(a, b) {
  vg.strokeStyle = '#fff'; vg.lineCap = 'round'; vg.lineWidth = b.w;
  vg.beginPath(); vg.moveTo(a.x, a.y); vg.lineTo(b.x, b.y); vg.stroke();
  dirty = true;
}

function scatter(cx, cy, r) {
  const all = r === Infinity;
  for (const a of atts) if (all || (a.x - cx) ** 2 + (a.y - cy) ** 2 < r * r) a.alive = false;
  const count = Math.round((all ? N : Math.PI * r * r) * DENSITY);
  for (let k = 0; k < count; k++) {
    let x, y;
    if (all) { x = rand() * GW; y = rand() * GH; }
    else { const a = rand() * 2 * Math.PI, d = r * Math.sqrt(rand()); x = cx + Math.cos(a) * d; y = cy + Math.sin(a) * d; }
    if (x >= 0 && y >= 0 && x < GW && y < GH) atts.push({ x, y, alive: true });
  }
}

function grow() {
  const pulls = new Map(), R2 = REACH * REACH, K2 = KILL * KILL;
  for (const a of atts) {
    if (!a.alive) continue;
    const bx = (a.x / REACH) | 0, by = (a.y / REACH) | 0;
    let best = -1, bd = R2;
    for (let j = by - 1; j <= by + 1; j++) {
      if (j < 0 || j >= BH) continue;
      for (let i = bx - 1; i <= bx + 1; i++) {
        if (i < 0 || i >= BW) continue;
        for (const k of buckets[j * BW + i]) {
          const n = nodes[k], d = (n.x - a.x) ** 2 + (n.y - a.y) ** 2;
          if (d < bd) { bd = d; best = k; }
        }
      }
    }
    if (best < 0) continue;
    if (bd < K2) { a.alive = false; continue; }
    const n = nodes[best], d = Math.sqrt(bd);
    let e = pulls.get(best);
    if (!e) pulls.set(best, e = { x: 0, y: 0, list: [] });
    e.x += (a.x - n.x) / d; e.y += (a.y - n.y) / d; e.list.push(a);
  }
  for (const [k, e] of pulls) {
    const n = nodes[k];
    let l = Math.hypot(e.x, e.y) || 1, dx = e.x / l, dy = e.y / l;
    const px = dx, py = dy;
    const rx = n.x - n.ox, ry = n.y - n.oy, rl = Math.hypot(rx, ry);
    if (rl > 0) { dx += RADIAL * rx / rl; dy += RADIAL * ry / rl; }
    dx += gauss() * WOBBLE; dy += gauss() * WOBBLE;
    l = Math.hypot(dx, dy) || 1; dx /= l; dy /= l;
    const x = n.x + dx * STEP, y = n.y + dy * STEP;
    // A node forks at most once, and never grows away from what pulls it;
    // attractors it can't serve are dropped (else it would sprout every step).
    if (n.kids >= 2 || dx * px + dy * py < 0.3 || x < 0 || y < 0 || x >= GW || y >= GH) {
      for (const a of e.list) a.alive = false;
      continue;
    }
    n.kids++;
    addNode(x, y, k, Math.max(1.1, n.w * 0.995), [n.ox, n.oy]);
  }
  if (++steps % 40 === 0) atts = atts.filter(a => a.alive);
}

// Drop wiped nodes once they pile up, re-indexing parents and buckets.
let deadCount = 0;
function compact() {
  const map = new Int32Array(nodes.length).fill(-1), kept = [];
  nodes.forEach((n, k) => { if (!n.dead) { map[k] = kept.length; kept.push(n); } });
  for (const n of kept) n.p = n.p >= 0 ? map[n.p] : -1;
  nodes = kept;
  for (let b = 0; b < buckets.length; b++) buckets[b] = buckets[b].map(k => map[k]).filter(k => k >= 0);
  if (down && down.drag) { down.last = map[down.last]; down.list = down.list.map(k => map[k]).filter(k => k >= 0); }
  deadCount = 0;
}

function readSources() {
  const d = vg.getImageData(0, 0, GW, GH).data, list = [];
  for (let i = 0; i < N; i++) if (d[i * 4 + 3] > 90) list.push(i);
  srcList = Int32Array.from(list);
  dirty = false;
}

// A wound: veins, pigment and spent attractors inside the disc are wiped,
// fresh attractors are scattered, and the surrounding veins grow back in.
function wound(cx, cy, r, keepStroke) {
  const x0 = Math.max(0, ((cx - r) / REACH) | 0), x1 = Math.min(BW - 1, ((cx + r) / REACH) | 0);
  const y0 = Math.max(0, ((cy - r) / REACH) | 0), y1 = Math.min(BH - 1, ((cy + r) / REACH) | 0);
  for (let j = y0; j <= y1; j++) for (let i = x0; i <= x1; i++) {
    const b = buckets[j * BW + i];
    for (const k of b) {
      const n = nodes[k];
      if (n.stroke !== keepStroke && (n.x - cx) ** 2 + (n.y - cy) ** 2 < r * r) {
        n.dead = true; deadCount++;
        if (n.p >= 0) nodes[n.p].kids--;           // the parent may branch again
      }
    }
    buckets[j * BW + i] = b.filter(k => !nodes[k].dead);
  }
  vg.save(); vg.globalCompositeOperation = 'destination-out';
  vg.beginPath(); vg.arc(cx, cy, r, 0, 2 * Math.PI); vg.fill(); vg.restore();
  const ya = Math.max(0, (cy - r) | 0), yb = Math.min(GH - 1, (cy + r) | 0);
  for (let y = ya; y <= yb; y++) {
    const h = Math.sqrt(Math.max(0, r * r - (y - cy) ** 2));
    for (let x = Math.max(0, (cx - h) | 0); x <= Math.min(GW - 1, (cx + h) | 0); x++) u[y * GW + x] = 0;
  }
  scatter(cx, cy, r);
  dirty = true;
}

// ---------- pigment ----------------------------------------------------------
function diffuse() {
  const a = 1 - 4 * DT - DT / (LAMBDA * LAMBDA), S = srcList;
  for (let it = 0; it < ITER; it++) {
    for (let y = 1; y < GH - 1; y++) {
      let i = y * GW + 1;
      for (let x = 1; x < GW - 1; x++, i++) u2[i] = a * u[i] + DT * (u[i - 1] + u[i + 1] + u[i - GW] + u[i + GW]);
    }
    for (let c = 0; c < S.length; c++) u2[S[c]] = 1;
    for (let x = 0; x < GW; x++) { u2[x] = u2[x + GW]; u2[N - GW + x] = u2[N - 2 * GW + x]; }   // no-flux borders
    for (let y = 0; y < GH; y++) { u2[y * GW] = u2[y * GW + 1]; u2[y * GW + GW - 1] = u2[y * GW + GW - 2]; }
    const t = u; u = u2; u2 = t;
  }
}

// ---------- drawing ----------------------------------------------------------
let colS, colC, colH, rowS, rowC, rowH;
function render(t) {
  if (!colS || colS.length !== GW) { colS = new Float32Array(GW); colC = new Float32Array(GW); colH = new Float32Array(GW); }
  if (!rowS || rowS.length !== GH) { rowS = new Float32Array(GH); rowC = new Float32Array(GH); rowH = new Float32Array(GH); }
  const ph = t * 0.35;                             // slow wave: sin(kx·x + ky·y + ph)
  for (let x = 0; x < GW; x++) { colS[x] = Math.sin(x * 0.011 + ph); colC[x] = Math.cos(x * 0.011 + ph); colH[x] = x / GW * HUE_X; }
  for (let y = 0; y < GH; y++) { rowS[y] = Math.sin(y * 0.007); rowC[y] = Math.cos(y * 0.007); rowH[y] = y / GH * HUE_Y + t * HUE_T; }
  const d = img.data;
  for (let y = 0, i = 0; y < GH; y++) {
    const rs = rowS[y], rc = rowC[y], rh = rowH[y];
    for (let x = 0; x < GW; x++, i++) {
      const w1 = colS[x] * rc + colC[x] * rs, w2 = colC[x] * rc - colS[x] * rs;
      const hi = HI * (1 + 0.08 * w1), lo = LO * (1 + 0.35 * w2);
      const v = u[i] + noise[i];
      const p = smooth(lo - E, lo + E, v) * (1 - smooth(hi - E, hi + E, v));
      const o = i * 4, j = (((colH[x] + rh) | 0) & (LUT - 1)) * 3;
      const r = INK_LUT[j], g = INK_LUT[j + 1], b = INK_LUT[j + 2];
      d[o] = r + (PAPER_LUT[j] - r) * p; d[o + 1] = g + (PAPER_LUT[j + 1] - g) * p; d[o + 2] = b + (PAPER_LUT[j + 2] - b) * p; d[o + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
}

// ---------- caterpillar ------------------------------------------------------
// A chain of segments that follows its own head's path. A wave of stretching
// runs from tail to head as it crawls. Coordinates here are css px.
const bug = document.getElementById('bug'), bctx = bug.getContext('2d');
const SEGS = 12, SIZE = 1.6, GAP = 8.5 * SIZE;
const head = { x: innerWidth / 2, y: innerHeight / 2 }, target = { x: head.x, y: head.y };
let dpr = 1, trail = [], crawled = 0, lastMove = -1e9, wander = rand() * 2 * Math.PI;

function sizeBug() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  bug.width = Math.round(innerWidth * dpr); bug.height = Math.round(innerHeight * dpr);
  bug.style.width = innerWidth + 'px'; bug.style.height = innerHeight + 'px';
  head.x = Math.min(head.x, innerWidth - 1); head.y = Math.min(head.y, innerHeight - 1);
  trail = [];
  for (let k = 0; k < 260; k++) trail.push([head.x - k, head.y]);   // newest first
}

function crawl(now) {
  if (now - lastMove > 5000) {                     // nobody steering: wander
    wander += gauss() * 0.12;
    const m = 60;
    if (head.x < m) wander = 0; else if (head.x > innerWidth - m) wander = Math.PI;
    if (head.y < m) wander = Math.PI / 2; else if (head.y > innerHeight - m) wander = -Math.PI / 2;
    target.x = head.x + Math.cos(wander) * 30; target.y = head.y + Math.sin(wander) * 30;
  }
  const dx = target.x - head.x, dy = target.y - head.y, d = Math.hypot(dx, dy);
  const speed = Math.min(d * 0.16, now - lastMove > 5000 ? 0.9 : 14);
  if (d > 0.5) { head.x += dx / d * speed; head.y += dy / d * speed; crawled += speed; }
  const [lx, ly] = trail[0];
  if (Math.hypot(head.x - lx, head.y - ly) > 1) { trail.unshift([head.x, head.y]); if (trail.length > 600) trail.pop(); }
}

// Segment centres, walked back along the trail from the head.
function bodyPoints(phase) {
  const pts = [[head.x, head.y]];
  let px = head.x, py = head.y, acc = 0, need = 0, k = 0;
  for (let i = 1; i < SEGS; i++) {
    need += GAP * (1 + 0.22 * Math.sin(phase + i * 0.75));
    while (k < trail.length) {
      const [qx, qy] = trail[k], L = Math.hypot(qx - px, qy - py);
      if (L > 0 && acc + L >= need) { const f = (need - acc) / L; px += (qx - px) * f; py += (qy - py) * f; acc = need; break; }
      acc += L; px = qx; py = qy; k++;
    }
    pts.push([px, py]);
  }
  return pts;
}

const css = (L, j, boost = 1) => {
  const r = L[j], g = L[j + 1], b = L[j + 2], m = (r + g + b) / 3;
  const c = v => Math.max(0, Math.min(255, Math.round(m + (v - m) * boost)));
  return `rgb(${c(r)},${c(g)},${c(b)})`;
};

function drawBug(t) {
  bctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  bctx.clearRect(0, 0, innerWidth, innerHeight);
  const phase = crawled * 0.12 + t * 0.6, pts = bodyPoints(phase);
  const h = hueAt(head.x / CELL, head.y / CELL, t);
  const ink = css(INK_LUT, h * 3), body = css(PAPER_LUT, ((h + LUT / 2) & (LUT - 1)) * 3, 2.6);
  bctx.lineWidth = 1.8; bctx.strokeStyle = ink;
  for (let i = SEGS - 1; i >= 1; i--) {            // tail first, so each segment overlaps the one behind
    const f = i / (SEGS - 1), r = 6.8 * SIZE * (1 - 0.55 * f ** 2.2) * (1 + 0.06 * Math.sin(phase + i * 0.75));
    const [x, y] = pts[i];
    bctx.fillStyle = body;
    bctx.beginPath(); bctx.arc(x, y, r, 0, 2 * Math.PI); bctx.fill(); bctx.stroke();
    bctx.fillStyle = ink;
    bctx.beginPath(); bctx.arc(x, y, r * 0.24, 0, 2 * Math.PI); bctx.fill();
  }
  const [hx, hy] = pts[0], [nx, ny] = pts[1];
  let a = Math.atan2(hy - ny, hx - nx);
  if (!isFinite(a)) a = 0;
  bctx.fillStyle = ink;
  bctx.beginPath(); bctx.arc(hx, hy, 7.4 * SIZE, 0, 2 * Math.PI); bctx.fill();
  for (const s of [-1, 1]) {                       // two short horns and two eyes
    const ha = a + s * 0.55, ex = hx + Math.cos(ha) * 16 * SIZE, ey = hy + Math.sin(ha) * 16 * SIZE;
    bctx.beginPath(); bctx.moveTo(hx + Math.cos(ha) * 6 * SIZE, hy + Math.sin(ha) * 6 * SIZE); bctx.lineTo(ex, ey); bctx.stroke();
    bctx.beginPath(); bctx.arc(ex, ey, 2 * SIZE, 0, 2 * Math.PI); bctx.fill();
    bctx.fillStyle = body;
    bctx.beginPath(); bctx.arc(hx + Math.cos(a + s * 0.8) * 3.6 * SIZE, hy + Math.sin(a + s * 0.8) * 3.6 * SIZE, 1.5 * SIZE, 0, 2 * Math.PI); bctx.fill();
    bctx.fillStyle = ink;
  }
}

// ---------- mouse ------------------------------------------------------------
let stroke = 0, down = null;

addEventListener('pointermove', e => {
  target.x = e.clientX; target.y = e.clientY; lastMove = performance.now();
  if (down && !down.drag && Math.hypot(e.clientX - down.px, e.clientY - down.py) > 8) startVein();
});

cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId);
  hint.style.opacity = 0;
  target.x = e.clientX; target.y = e.clientY; lastMove = performance.now();
  down = { px: e.clientX, py: e.clientY, drag: false };
});

// Once the press turns into a drag, the caterpillar's head starts laying a vein.
function startVein() {
  const x = head.x / CELL, y = head.y / CELL;
  stroke++;
  wound(x, y, DRAG_R, stroke);
  Object.assign(down, { drag: true, x, y, last: addNode(x, y, -1, 2.6, undefined, stroke), list: [] });
}

function layVein() {
  if (!down || !down.drag) return;
  const x = head.x / CELL, y = head.y / CELL;
  let d = Math.hypot(x - down.x, y - down.y);
  if (d < STEP) return;
  while (d >= STEP) {                              // one step at a time
    const f = STEP / d;
    down.x += (x - down.x) * f; down.y += (y - down.y) * f;
    wound(down.x, down.y, DRAG_R, stroke);
    down.last = addNode(down.x, down.y, down.last, 2.6, undefined, stroke);
    down.list.push(down.last);
    d = Math.hypot(x - down.x, y - down.y);
  }
  for (const k of down.list) if (nodes[k].p >= 0) drawSegment(nodes[nodes[k].p], nodes[k]);   // the wound erased part of it
}

const release = () => {
  if (!down) return;
  if (!down.drag) {                                // a click: wound and reseed
    const x = down.px / CELL, y = down.py / CELL;
    stroke++;
    wound(x, y, CLICK_R, stroke);
    addNode(x, y, -1, 2.6, undefined, stroke);
  }
  down = null;
};
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);

let resizeTimer;
addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { init(); sizeBug(); }, 250); });

// ---------- loop -------------------------------------------------------------
const t0 = performance.now();
function frame() {
  const now = performance.now(), t = (now - t0) / 1000;
  crawl(now);
  layVein();
  grow(); grow();
  if (deadCount > 40000 && !down) compact();
  if (dirty) readSources();
  diffuse();
  render(t);
  drawBug(t);
  requestAnimationFrame(frame);
}
init();
sizeBug();
requestAnimationFrame(frame);
</script>
</body>
</html>
