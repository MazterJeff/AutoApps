<html><body>
<form id="application-form" method="POST" enctype="multipart/form-data">
 <ul>
  <li class="application-question resume"><label><div class="application-label">Resume/CV<span class="required">✱</span></div>
     <div class="application-field"><input type="file" name="resume" id="resume-upload-input" required></div></label></li>
  <li class="application-question"><label><div class="application-label">Full name<span class="required">✱</span></div>
     <div class="application-field"><input type="text" name="name" required></div></label></li>
  <li class="application-question"><label><div class="application-label">Email<span class="required">✱</span></div>
     <div class="application-field"><input type="email" name="email" required></div></label></li>
  <li class="application-question"><label><div class="application-label">Phone</div>
     <div class="application-field"><input type="text" name="phone"></div></label></li>
  <li class="application-question"><label><div class="application-label">Current company</div>
     <div class="application-field"><input type="text" name="org"></div></label></li>
  <li class="application-question"><label><div class="application-label">LinkedIn URL</div>
     <div class="application-field"><input type="text" name="urls[LinkedIn]"></div></label></li>
  <li class="application-question"><label><div class="application-label">GitHub URL</div>
     <div class="application-field"><input type="text" name="urls[GitHub]"></div></label></li>
 </ul>
 <input type="hidden" name="cards[abc][baseTemplate]" value="{}">
 <ul>
  <li class="application-question custom-question"><div class="application-label"><div class="text">Are you currently enrolled in a degree program?<span class="required">✱</span></div></div>
    <div class="application-field"><ul data-qa="multiple-choice">
      <li><label><input type="radio" name="cards[abc][field0]" value="Yes"><span class="application-answer-alternative">Yes</span></label></li>
      <li><label><input type="radio" name="cards[abc][field0]" value="No"><span class="application-answer-alternative">No</span></label></li>
    </ul></div></li>
  <li class="application-question custom-question"><div class="application-label"><div class="text">What tools do you use?</div></div>
    <div class="application-field"><ul>
      <li><label><input type="checkbox" name="cards[abc][field1]" value="Excel">Excel</label></li>
      <li><label><input type="checkbox" name="cards[abc][field1]" value="Python">Python</label></li>
    </ul></div></li>
  <li class="application-question custom-question"><div class="application-label"><div class="text">Tell us about a project you're proud of<span class="required">✱</span></div></div>
    <div class="application-field"><textarea name="cards[abc][field2]"></textarea></div></li>
  <li class="application-question custom-question"><div class="application-label"><div class="text">School year</div></div>
    <div class="application-field"><select name="cards[abc][field3]"><option value="">Select...</option><option value="Junior">Junior</option><option value="Senior">Senior</option></select></div></li>
 </ul>
 <li class="application-question"><label><div class="application-label">Gender</div>
   <div class="application-field"><select name="eeo[gender]"><option value="">Select ...</option><option value="Male">Male</option><option value="Female">Female</option><option value="Decline to self-identify">Decline to self-identify</option></select></div></label></li>
 <li class="application-question"><label><input type="checkbox" name="consent[marketing]" value="1"> I agree to receive updates</label></li>
 <textarea name="comments" placeholder="Add a cover letter or anything else you want to share."></textarea>
 <button type="submit">Submit application</button>
</form></body></html>
